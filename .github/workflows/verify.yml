name: Verify ytZoom

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify playback integration
        run: node --test Tests/playback.test.mjs
      - name: Compile native app
        run: swift build --configuration release --arch x86_64
