name: Verify ytZoom

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify playback integration
        run: node --test Tests/*.test.mjs
      - name: Compile native app
        run: |
          set -euo pipefail
          swift build --configuration release --arch x86_64
          swift build --configuration release --arch x86_64 --show-bin-path > "$RUNNER_TEMP/binpath"

      - name: Assemble and sign app
        run: |
          set -euo pipefail
          BIN_DIR="$(cat "$RUNNER_TEMP/binpath")"
          mkdir -p dist/ytZoom.app/Contents/MacOS
          cp "$BIN_DIR/ytZoom" dist/ytZoom.app/Contents/MacOS/ytZoom
          chmod +x dist/ytZoom.app/Contents/MacOS/ytZoom
          cat > dist/ytZoom.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>ytZoom</string>
            <key>CFBundleIdentifier</key><string>app.ytzoom.macos</string>
            <key>CFBundleName</key><string>ytZoom</string>
            <key>CFBundleDisplayName</key><string>ytZoom</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.1</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.video</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          plutil -lint dist/ytZoom.app/Contents/Info.plist
          codesign --force --sign - dist/ytZoom.app
          codesign --verify dist/ytZoom.app
          ditto -c -k --keepParent dist/ytZoom.app dist/ytZoom-macOS-Intel.zip
          unzip -t dist/ytZoom-macOS-Intel.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytZoom-macOS-Intel
          path: dist/ytZoom-macOS-Intel.zip
          if-no-files-found: error
